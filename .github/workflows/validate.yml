name: Validate analysis
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
      - run: uv sync --locked
      - run: uv run --locked ruff check .
      - run: uv run --locked ruff format --check .
      - run: uv run --locked ty check
      - run: uv run --locked python -m unittest discover -s tests -v
      - run: uv build
      - name: Test installed wheel without the source package
        run: uv run --isolated --no-project --with ./dist/perfeng_analysis-0.4.0-py3-none-any.whl python -m unittest discover -s tests -v
      - uses: actions/upload-artifact@v4
        with:
          name: perfeng-analysis-0.4.0
          path: dist/*
