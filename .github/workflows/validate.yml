name: Validate analysis

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Keep this job identity and its Linux package/image coverage stable for
  # existing branch-protection rules.
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version-file: .python-version
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
      - run: make bootstrap
      - run: make doctor
      - run: make verify
      - name: Test installed wheel without the source package
        run: uv run --isolated --no-project --with ./dist/*.whl python -m unittest discover -s tests -v
      - name: Build and verify standalone image
        run: |
          docker build --platform linux/amd64 -t perfeng-analysis:ci .
          uv run --locked --offline python scripts/image.py verify perfeng-analysis:ci
      - uses: actions/upload-artifact@v7
        with:
          name: perfeng-analysis-wheel
          path: dist/*


  supply-chain:
    name: Supply chain
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version-file: .python-version
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
      - run: make supply-chain
