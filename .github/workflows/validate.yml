name: Validate analysis

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Keep this job identity and its Linux package/image coverage stable for
  # existing branch-protection rules.
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version-file: .python-version
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
      - run: make bootstrap
      - run: make doctor
      - run: make verify
      - name: Test installed wheel without the source package
        run: uv run --isolated --no-project --with ./dist/*.whl python -m unittest discover -s tests -v
      - name: Build and verify standalone image
        run: |
          docker build --platform linux/amd64 -t perfeng-analysis:ci .
          uv run --locked --offline python scripts/image.py verify perfeng-analysis:ci
      - uses: actions/upload-artifact@v7
        with:
          name: perfeng-analysis-wheel
          path: dist/*

  windows:
    name: Windows verification
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version-file: .python-version
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
      - name: Install GNU Make
        shell: pwsh
        run: choco install make --version=4.4.1 --no-progress --yes
      - run: make bootstrap
      - run: make doctor
      - run: make verify

  supply-chain:
    name: Supply chain
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version-file: .python-version
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
      - run: make supply-chain
